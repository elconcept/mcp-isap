# mcp-isap - akty prawne ISAP/ELI (api.sejm.gov.pl) (stdio z repo -> supergateway, Streamable HTTP /mcp, port 8000). Stack Portainera "mcp-isap".
# Bez portu na hoscie. Dostep wylacznie: https://mcp-isap.xlap.pl/mcp - tunel cloudflared, bez Access (publiczny,
# bezstanowy - konektory claude.ai/ChatGPT). cf_mcp_isap: cloudflared + ten serwis, z wyjsciem do internetu.
# Przebudowa po pushu na main: deploy-hook (.github/workflows/deploy.yml).
services:
  mcp-isap:
    build:
      context: /volume2/docker/mcp-isap
      dockerfile: Dockerfile.nas
    image: mcp-isap:latest
    container_name: mcp-isap
    user: "1029:100"
    environment:
      - TZ=Europe/Warsaw
    networks:
      - cf_mcp_isap
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  cf_mcp_isap:
    external: true
